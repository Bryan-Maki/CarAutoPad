name: Build CarAutoPad IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Run Unit Tests
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPad" | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | tail -n 1)
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | tail -n 1)
          fi
          echo "Selected simulator ID: $SIM_ID"
          defaults write com.apple.dt.Xcode ContinueBuildingAfterErrors -bool true || true
          xcodebuild build-for-testing \
            -workspace CarAutoPad.xcworkspace \
            -scheme CarAutoPad \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            ContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test-without-building \
            -workspace CarAutoPad.xcworkspace \
            -scheme CarAutoPad \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build and Package Unsigned IPA
        run: |
          chmod +x scripts/build_unsigned_ipa.sh
          ./scripts/build_unsigned_ipa.sh "$RUNNER_TEMP/carautopad-ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAutoPad-Unsigned-IPA
          path: ${{ runner.temp }}/carautopad-ipa/CarAutoPad.ipa
          if-no-files-found: error
