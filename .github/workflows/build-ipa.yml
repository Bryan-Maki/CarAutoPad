name: Build CarAutoPad IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Package IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare OpenSSL dependency
        run: |
          mkdir -p vendor/OpenSSL-Universal
          echo "Resolving OpenSSL asset via GitHub API..."
          ASSET_URL=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/krzyzanowskim/OpenSSL/releases/tags/3.6.2000" \
            | grep -o 'https://api.github.com/repos/krzyzanowskim/OpenSSL/releases/assets/[0-9]*' | head -n 1 || true)
          if [ -z "$ASSET_URL" ]; then
            ASSET_URL="https://api.github.com/repos/krzyzanowskim/OpenSSL/releases/assets/426003225"
          fi
          echo "Downloading OpenSSL.xcframework from $ASSET_URL..."
          curl -sS -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o OpenSSL.xcframework.zip
          unzip -q OpenSSL.xcframework.zip -d vendor/OpenSSL-Universal/
          rm OpenSSL.xcframework.zip
          test -d vendor/OpenSSL-Universal/OpenSSL.xcframework
          echo "OpenSSL.xcframework successfully prepared."

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Run Unit Tests
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone 16" | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -E "iPad" | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | tail -n 1)
          fi
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | tail -n 1)
          fi
          echo "Selected simulator ID: $SIM_ID"
          defaults write com.apple.dt.Xcode ContinueBuildingAfterErrors -bool true || true
          xcodebuild build-for-testing \
            -workspace CarAutoPad.xcworkspace \
            -scheme CarAutoPad \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            ContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test-without-building \
            -workspace CarAutoPad.xcworkspace \
            -scheme CarAutoPad \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build and Package Unsigned IPA
        run: |
          chmod +x scripts/build_unsigned_ipa.sh
          ./scripts/build_unsigned_ipa.sh "$RUNNER_TEMP/carautopad-ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAutoPad-Unsigned-IPA
          path: ${{ runner.temp }}/carautopad-ipa/CarAutoPad.ipa
          if-no-files-found: error
